[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mlst-typing"
version = "0.5.0"
description = "Automatic MLST typing of assembled genomes against PubMLST schemes (Python redesign of tseemann/mlst)"
readme = "README.md"
license = {text = "GPL-2.0-only"}
authors = [{name = "TinusTK"}]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mlst-typing = "mlst_typing:main"

# The database travels with a pip install: database/ is installed beside the
# module as the data folder "mlst_typing_database", where find_database() looks.
[tool.setuptools]
package-dir = {"" = "tool", "mlst_typing_database" = "database"}
# mlst_typing_setup (own PubMLST key) and mlst_typing_update (the database
# updater it runs) are command-line only; the Galaxy bundle leaves them out.
py-modules = ["mlst_typing", "mlst_typing_setup", "mlst_typing_update"]
packages = ["mlst_typing_database"]

[tool.setuptools.package-data]
mlst_typing_database = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
